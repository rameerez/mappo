<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mars Transfer — Mappo.js</title>
<link rel="icon" href="../favicon/favicon-32x32.png">
<style>
  :root{
    --bg:#05080e; --ink:#dbe6f5; --dim:#7d8 da0; --dim:#7d8da0; --faint:#4b5768;
    --line:#182231; --panel:rgb(9 14 22 / .82);
    --earth:#4f8fd8; --mars:#c1613a; --ship:#ffd479; --booster:#8fb7e8;
    --warn:#ff8b5e; --ok:#5fd0a4;
    --tc-bg:rgb(9 14 22 / .82); --tc-line:#182231; --tc-accent:#ffd479;
    --tc-ink:#dbe6f5; --tc-dim:#7d8da0; --tc-faint:#4b5768;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-font-smoothing:antialiased}
  /* Stars sit BEHIND the globes; the overlay in front of them clears rather
     than fills, or it would paint over the very thing it is annotating. */
  #stars{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:0}
  #near3d{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:1}
  /* Off-screen, not display:none — a hidden element has no box and mappo would
     render it at its 300 px fallback, which is not enough map to be a texture. */
  #texsrc{position:absolute;left:-20000px;top:0;width:2048px;pointer-events:none}
  .globe{z-index:1}
  #view{display:block;position:absolute;inset:0;width:100%;height:100%;z-index:2}
  /* The globe sits under the overlay and is sized square, centred in the clear
     part of the frame — the same clear part the 3D scenes centre on. */
  .globe{position:absolute;top:0;left:0;pointer-events:none}
  /* The overlay lives INSIDE the wrapper, so a tilt on the wrapper carries the
     trajectory with the geography and locate()'s answers stay usable unchanged.
     Tilting only the globe would slide the two apart. */
  .globe .oc{position:absolute;inset:0;width:100%;height:100%}
  .hud{z-index:3}
  .globe mappo-world{display:block;width:100%}

  .hud{position:absolute;inset:0;pointer-events:none}
  .hud > *{pointer-events:auto}

  .title{position:absolute;left:22px;top:18px;max-width:min(34ch,42vw)}
  .title h1{margin:0 0 2px;font-size:15px;font-weight:600;letter-spacing:.04em}
  .title p{margin:0;color:var(--dim);font-size:11.5px;line-height:1.45}
  .phase{margin-top:14px;font-size:26px;font-weight:600;letter-spacing:.01em;
    color:var(--ship);line-height:1.1}
  .met{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:2px}
  .met span{color:var(--faint)}

  .panel{position:absolute;right:22px;top:18px;width:268px;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:13px 15px;
    backdrop-filter:blur(8px)}
  .panel h2{margin:0 0 9px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  .panel + .panel{top:auto}
  .kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .kv dd b{font-weight:600;color:var(--ship)}

  #window{right:22px;top:auto;bottom:112px;width:268px}
  #pork{display:block;width:100%;height:96px;border-radius:6px;margin:2px 0 8px;
    background:#070b12;image-rendering:pixelated}
  .legend{display:flex;justify-content:space-between;color:var(--faint);font-size:10px}

  /* The phase strip: bookmarks into the clock, not a second source of truth. */
  .bl{position:absolute;left:22px;bottom:22px;display:flex;flex-direction:column;
    gap:11px;max-width:min(600px,50vw)}
  .phases{display:flex;gap:4px;flex-wrap:wrap}
  .phases button{background:rgb(9 14 22 / .8);border:1px solid var(--line);
    color:var(--dim);border-radius:6px;padding:4px 7px;font:10px/1.3 inherit;
    cursor:pointer;letter-spacing:.02em;white-space:nowrap}
  .phases button:hover{color:var(--ink);border-color:#2a3a4f}
  .phases button[aria-current="true"]{color:#07101c;background:var(--ship);
    border-color:var(--ship);font-weight:600}
  .phases button:focus-visible{outline:2px solid var(--ship);outline-offset:2px}

  .tc-wrap{position:absolute;right:22px;bottom:22px}
  .note{margin:0;color:var(--faint);font-size:10.5px;line-height:1.55}
  .src{color:var(--faint);font-size:10.5px}
  .src summary{cursor:pointer;color:var(--dim);padding:2px 0;list-style:none}
  .src summary::before{content:"▸ ";color:var(--faint)}
  .src[open] summary::before{content:"▾ "}
  .src summary:hover{color:var(--ink)}
  .src dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0;
    max-height:38vh;overflow:auto;padding-right:6px}
  .src dt{color:var(--dim);white-space:nowrap}
  .src dd{margin:0}
  .src a{color:var(--faint);text-decoration:underline;text-underline-offset:2px}
  .src a:hover{color:var(--ship)}
  a{color:var(--dim)}
  @media (max-width:900px){.panel,#window{display:none}}
</style>

<!-- Earth and Mars are mappo. The trajectory is registered to them through
     map.locate(lat, lon, radius) — radius in body radii, which is the hook the
     component provides for exactly this: draw your own layer, and have it land
     on the pixel the geography is on. -->
<canvas id="stars"></canvas>
<!-- The near-Earth view is real 3D: a camera a few km above Starbase looking
     along the surface. The sphere's texture is a mappo flat map, rasterised
     from the element below — which is why the coastlines are still mappo's. -->
<canvas id="near3d"></canvas>
<div id="texsrc" aria-hidden="true">
  <mappo-world id="earthFlat" mode="flat" cols="360" lat-min="-90" lat-max="90"
    figure="solid outline" figure-source="vector"
    figure-color="#24603a" figure-stroke="#9ae8b6" figure-stroke-width="0.5"
    borders borders-color="#63a884" borders-opacity="0.7"
    ground-color="#123a5c" background="#123a5c" interactive="false"></mappo-world>
</div>
<div class="globe" id="earthWrap">
  <mappo-world id="earthGlobe" mode="globe" cols="220"
    focus="25.997,-97.155" rotate-speed="0" globe-ring
    figure="outline" figure-source="vector"
    figure-stroke="#5b9ae0" figure-stroke-width="0.6"
    borders borders-color="#33587f" borders-opacity="0.55"
    ground-color="#0a1725" background="none" interactive="false"></mappo-world>
  <canvas class="oc"></canvas>
</div>
<div class="globe" id="marsWrap" hidden>
  <mappo-world id="marsGlobe" body="mars" mode="globe" cols="220"
    focus="39.09,-170.21" rotate-speed="0" globe-ring
    figure="outline" figure-source="vector"
    figure-stroke="#e08a5c" figure-stroke-width="0.6"
    ground-color="#7c3f24" background="none" interactive="false"></mappo-world>
  <canvas class="oc"></canvas>
</div>
<canvas id="view"></canvas>

<div class="hud">
  <div class="title">
    <h1>FIRST CREWED TRANSFER · EARTH → MARS</h1>
    <p>Starbase, Texas → Arcadia Planitia. Trajectory solved, not sketched.</p>
    <div class="phase" id="phase">—</div>
    <div class="met" id="met"><span>T</span> —</div>
  </div>

  <div class="panel" id="tele">
    <h2>Telemetry</h2>
    <dl class="kv" id="telekv"></dl>
  </div>

  <div class="panel" id="window">
    <h2>Launch window</h2>
    <canvas id="pork" width="240" height="96"></canvas>
    <div class="legend"><span id="porkA">—</span><span id="porkB">—</span></div>
    <dl class="kv" id="winkv"></dl>
  </div>

  <div class="bl">
    <p class="note" id="note"></p>
    <details class="src"><summary>Sources — every number on this page</summary>
      <div id="srcbody"></div>
    </details>
    <div class="phases" id="phases"></div>
  </div>
  <div class="tc-wrap"><div id="tc"></div></div>
</div>

<script type="module">
// The component this whole page is a demo of. Earth ships in the bundle; Mars
// is an opt-in pack, handed over by name — which is the point of the packs:
// the approach to Arcadia Planitia is drawn by the code that drew Starbase.
import { registerBody } from "../dist/all.js";
import { MARS } from "../dist/bodies/mars.js";
registerBody(MARS);

import { createClock } from "./timectl.js";
import { earthAt } from "./astro.js";
import * as M from "./mission.js";
import * as S from "./scene3d.js";
import { stack, superHeavy, starship, DIM } from "./vehicle.js";
import { loadGLB, normalize } from "./gltf.js";
import * as N3 from "./near3d.js";
import * as THREE from "./vendor/three.module.min.js";

const $ = (id) => document.getElementById(id);
const RAD = Math.PI / 180;

// The clear middle of the frame, which is not its middle: the telemetry and
// window panels take 290 px off the right whenever they are shown.
const clearX = (w) => w > 900 ? (w - 290) / 2 : w / 2;

// ── where we leave from, and where we are going ─────────────────────────────
// Starbase is where Starship flies from. Arcadia Planitia is where SpaceX has
// actually pointed: of the sites imaged by HiRISE at their request, most sit
// on southern Arcadia plains underlain by shallow, relatively pure water ice —
// low enough in latitude for power, low enough in elevation for the atmosphere
// to slow a 100-tonne ship down, and with the propellant feedstock already
// there. These are the coordinates of one of those HiRISE frames.
const PAD = { name: "Starbase, TX", lat: 25.9972, lon: -97.1560 };
const SITE = { name: "Arcadia Planitia", lat: 39.09, lon: 189.79 - 360 };

// ── the window, computed ────────────────────────────────────────────────────
// Nobody picks a Mars launch date. The shape of the two orbits picks it, and
// this is the search that finds it: every departure day against every flight
// time, keeping the cheapest. ~1200 Lambert solves, 25 ms.
const SCAN = { from: new Date("2026-10-01T00:00:00Z"), toDays: 120, stepDays: 3,
               tofMin: 150, tofMax: 380, tofStep: 8 };
const pork = M.porkchop(SCAN);
const TRIP = pork.best;

const TMI_MS = TRIP.departure.getTime();          // the burn that leaves Earth
// Launch, refuel, then go — six days ahead of the injection burn, and timed
// for mid-morning at the pad rather than the middle of the night. The window
// fixes the DATE, not the hour; 15:00 UTC is about 10 a.m. at Starbase.
const LAUNCH_MS = TMI_MS - 6 * 86400000 + 15 * 3600000;
const ARRIVE_MS = TRIP.arrival.getTime();
const T = (ms) => (ms - LAUNCH_MS) / 1000;        // mission elapsed time, seconds

// ── the timeline ────────────────────────────────────────────────────────────
// Ascent event times are Flight 5's, which is the flight that first caught a
// booster: MECO at T+02:33, catch at T+06:56. The ascent PROFILE between them
// is a plausible interpolation, not an integrated trajectory — said plainly
// because everything from TMI onward genuinely is solved.
const D = 86400;
const PHASES = [
  { id: "pad",     t: -25,        name: "PRELAUNCH",        blurb: "33 Raptors, 3,600 t of methalox" },
  { id: "liftoff", t: 0,          name: "LIFTOFF",          blurb: "74 MN off the pad" },
  { id: "maxq",    t: 62,         name: "MAX Q",            blurb: "peak aerodynamic pressure" },
  { id: "meco",    t: 153,        name: "MECO · HOT-STAGE", blurb: "ship lights through the ring" },
  { id: "boost",   t: 235,        name: "BOOSTBACK",        blurb: "booster reverses for home" },
  { id: "entry",   t: 350,        name: "BOOSTER ENTRY",    blurb: "grid fins, 20 km/min" },
  { id: "catch",   t: 416,        name: "TOWER CATCH",      blurb: "caught by the chopsticks" },
  { id: "seco",    t: 540,        name: "SECO · PARKING",   blurb: "ship in a 200 km orbit" },
  { id: "refuel",  t: 3 * D,      name: "ORBITAL REFUEL",   blurb: "tankers fill the ship" },
  { id: "tmi",     t: 6 * D,      name: "TRANS-MARS INJECTION", blurb: "the burn that leaves Earth" },
  { id: "cruise",  t: 6 * D + 40 * D, name: "CRUISE",       blurb: "coasting the transfer ellipse" },
  { id: "approach",t: (ARRIVE_MS - LAUNCH_MS) / 1000 - 3 * D, name: "MARS APPROACH", blurb: "inside Mars' sphere of influence" },
  { id: "edl",     t: (ARRIVE_MS - LAUNCH_MS) / 1000 - 360, name: "ENTRY · DESCENT", blurb: "aerocapture, belly first" },
  { id: "land",    t: (ARRIVE_MS - LAUNCH_MS) / 1000, name: "TOUCHDOWN",  blurb: "Arcadia Planitia" }
];
const phaseAt = (t) => PHASES.reduce((a, p) => (t >= p.t ? p : a), PHASES[0]);

// ── ascent profile ──────────────────────────────────────────────────────────
// Anchor points, linearly interpolated: altitude km, downrange km, speed km/s.
const ASCENT = [
  [ 0, 0, 0, 0 ], [ 20, 1.4, 0.1, 0.22 ], [ 62, 13, 3.2, 0.92 ],
  [ 110, 38, 30, 1.65 ], [ 153, 68, 95, 2.35 ], [ 220, 108, 215, 2.9 ],
  [ 320, 142, 470, 4.3 ], [ 430, 158, 940, 6.3 ], [ 540, 168, 1560, 7.66 ]
];
const BOOSTER = [
  [ 153, 68, 95 ], [ 200, 92, 88 ], [ 250, 100, 60 ], [ 300, 84, 32 ],
  [ 350, 56, 13 ], [ 390, 21, 3.2 ], [ 410, 3, 0.35 ], [ 416, 0.14, 0.02 ]
];
function lerpTable(table, t) {
  if (t <= table[0][0]) return table[0].slice(1);
  const last = table[table.length - 1];
  if (t >= last[0]) return last.slice(1);
  for (let i = 1; i < table.length; i++) {
    if (t <= table[i][0]) {
      const a = table[i - 1], b = table[i];
      const k = (t - a[0]) / (b[0] - a[0]);
      return a.slice(1).map((v, j) => v + (b.slice(1)[j] - v) * k);
    }
  }
  return last.slice(1);
}

// ── where the ship is over the Earth ────────────────────────────────────────
// Ascent comes off the table; after SECO the ship is in a 200 km circular
// parking orbit and the ground track is the orbit turning under a rotating
// planet — which is why successive passes march westward instead of repeating.
const PARK_ALT = 200;
const PARK_A = M.R_EARTH + PARK_ALT;
const PARK_T = 2 * Math.PI * Math.sqrt(Math.pow(PARK_A, 3) / M.MU_EARTH);   // ~88 min
const INC = 26.5 * RAD;              // what an eastward launch from 26°N gives
const OMEGA_E = 360 / 86164.1;       // deg/s, sidereal

// Anchored to the end of the ascent, so the orbit starts where the climb left
// off rather than somewhere merely plausible.
const SECO_T = 540;
const SECO_GROUND = (() => {
  const [ , dr ] = lerpTable(ASCENT, SECO_T);
  return { dr, t: SECO_T };
})();

function shipGround(t) {
  if (t <= SECO_T) {
    const [ alt, dr ] = lerpTable(ASCENT, Math.max(0, t));
    const [ lat, lon ] = downrangeTo(PAD.lat, PAD.lon, 93, dr);
    return { lat, lon, alt };
  }
  const [ lat0, lon0 ] = downrangeTo(PAD.lat, PAD.lon, 93, SECO_GROUND.dr);
  const u0 = Math.asin(Math.max(-1, Math.min(1, Math.sin(lat0 * RAD) / Math.sin(INC))));
  const raan = lon0 + OMEGA_E * SECO_T -
    Math.atan2(Math.cos(INC) * Math.sin(u0), Math.cos(u0)) / RAD;
  const u = u0 + 2 * Math.PI * (t - SECO_T) / PARK_T;
  const lat = Math.asin(Math.sin(INC) * Math.sin(u)) / RAD;
  const lon = raan + Math.atan2(Math.cos(INC) * Math.sin(u), Math.cos(u)) / RAD - OMEGA_E * t;
  return { lat, lon: ((lon % 360) + 540) % 360 - 180, alt: PARK_ALT };
}

// ── the transfer, sampled once ──────────────────────────────────────────────
const ARC = M.transferPath(TRIP, 300);
const EARTH_ORBIT = M.orbitPath("earth", TRIP.departure);
const MARS_ORBIT = M.orbitPath("mars", TRIP.departure);

// ── clock: the one authority ────────────────────────────────────────────────
const SPEEDS = [ -2592000, -86400, -3600, -600, -60, -1, 1, 60, 600, 3600, 86400, 2592000 ];
const RATE = { 1: "1×", 60: "1 min/s", 600: "10 min/s", 3600: "1 h/s",
               86400: "1 day/s", 2592000: "1 mo/s" };
const clock = createClock({
  mount: $("tc"), windowH: 24 * 420, speeds: SPEEDS, startSpeed: 1,
  rateLabel: (w) => (w < 0 ? "−" : "") + (RATE[Math.abs(w)] ?? `${Math.abs(w)}×`),
  hint: "or pick a phase",
  onScrub: () => paint()
});
clock.setTime(LAUNCH_MS - 25000);
const now = () => clock.now().getTime();

// ── camera ──────────────────────────────────────────────────────────────────
const cam = S.createCamera();
let camDist = 400, camTarget = [ 0, 0, 0 ];
let drag = null;
const view = $("view"), ctx = view.getContext("2d");
view.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; view.setPointerCapture(e.pointerId); });
view.addEventListener("pointerup", () => { drag = null; });
view.addEventListener("pointermove", (e) => {
  if (!drag) return;
  cam.az -= (e.clientX - drag.x) * 0.006;
  cam.el = Math.max(-1.45, Math.min(1.45, cam.el + (e.clientY - drag.y) * 0.006));
  drag = { x: e.clientX, y: e.clientY };
});
view.addEventListener("wheel", (e) => { e.preventDefault(); zoomBias *= Math.exp(e.deltaY * 0.0012); }, { passive: false });
let zoomBias = 1;

// ── scenes ──────────────────────────────────────────────────────────────────
// Four frames, chosen by mission time, because one world spanning a 9 m flap
// and a 1.5 AU transfer would spend its whole life in the noise of a float.
// Generated shapes first so the page draws immediately, then the real model
// swaps in when it arrives — a megabyte should not be a blank screen.
let BOOSTER_M = superHeavy(), SHIP_M = starship(), STACK = stack();
for (const [ file, set ] of [ [ "superheavy", (m) => { BOOSTER_M = m; }, ],
                              [ "starship", (m) => { SHIP_M = m; } ] ]) {
  loadGLB(`./models/${file}.glb`)
    .then((m) => { set(normalize(m)); })
    .catch((e) => console.warn(`[mission] ${file}.glb unavailable, drawing the generated shape`, e));
}


// Painted once per resize onto its own canvas underneath everything, not once
// per frame over the top of it.
const starCv = $("stars"), sctx = starCv.getContext("2d");
function drawStars(w, h) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  starCv.width = w * dpr; starCv.height = h * dpr;
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const ctx = sctx;
  ctx.fillStyle = "#05080e"; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = "#9fb0c6";
  for (let i = 0; i < 220; i++) {
    // Deterministic: a starfield that reshuffles every frame is a snowstorm.
    const a = Math.sin(i * 12.9898) * 43758.5453, b = Math.sin(i * 78.233) * 12345.6789;
    const x = (a - Math.floor(a)) * w, y = (b - Math.floor(b)) * h;
    ctx.globalAlpha = 0.18 + ((i * 37) % 10) / 22;
    ctx.fillRect(x, y, 1.1, 1.1);
  }
  ctx.globalAlpha = 1;
}

// ── the mappo globes ────────────────────────────────────────────────────────
const earthWrap = $("earthWrap"), marsWrap = $("marsWrap");
const globeOf = (wrap) => wrap.firstElementChild.map;
const ocOf = (wrap) => wrap.querySelector(".oc");

// NO CSS TILT — and the reason is worth writing down, because it looks like an
// obvious win. mappo's globe sizes its backing store from
// canvas.getBoundingClientRect(), and a 3D transform anywhere up the tree makes
// that return the TRANSFORMED box: laying the wrapper back 64° reported 5,665 px
// for an element set to 2,675, so the globe rebuilt itself at the wrong scale
// and locate() answered in a space nothing was drawn in.
//
// The second reason is that it would be a lie anyway. The globe is an
// orthographic render on a flat canvas; rotating that canvas foreshortens the
// picture of a sphere rather than looking along the surface of one, and at the
// angle needed to see "across the Gulf into the atmosphere" it reads as a
// squashed disc, not a horizon. An oblique launch view wants a real camera —
// which is what the heliocentric scenes use, and what mappo's globe, by design,
// is not.

// The overlay is wrapper-local, so locate() coordinates go straight in.
function ocContext(wrap, px) {
  const c = ocOf(wrap);
  const dpr = Math.min(1.5, devicePixelRatio || 1);
  const want = Math.round(px * dpr);
  if (c.width !== want) { c.width = want; c.height = want; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, px, px);
  return g;
}

// Size a globe, then put a chosen PLACE at a chosen point on screen.
//
// Not the globe's centre: `focus` turns the sphere in longitude but leaves the
// pole up, so Starbase at 26°N sits a good way above the middle of the disc.
// Centring the disc therefore pushes the launch site off the top of the frame
// once the globe is bigger than the window — which, since oversizing the globe
// past the frame IS the zoom, is exactly when it matters. Asking mappo where
// the place actually landed and shifting by that is both simpler and correct
// however the projection behaves.
function sizeGlobe(wrap, px, cx, cy, anchor) {
  const el = wrap.firstElementChild;
  // Quantised, because every change re-rasterises the whole globe: only resize
  // when the target has moved more than a few per cent.
  if (!(wrap._px > 0) || Math.abs(wrap._px - px) / px > 0.04) {
    el.style.width = `${px}px`;
    wrap.style.width = `${px}px`;
    wrap._px = px;
    // mappo's globe sizes from a ResizeObserver on its canvas, and it does not
    // pick this up: it stays at the 300 px fallback it took when the element
    // had no box yet, so locate() keeps answering in a space six times smaller
    // than the one being drawn — which is what put Starbase in the wrong place.
    // Poking _resize() directly is reaching inside; the library should notice
    // its own element changing width, and that is worth fixing there.
    el.map?._globe?._resize();
  }
  let dx = px / 2, dy = px / 2;
  const q = anchor && el.map?.locate(anchor[0], anchor[1], 1);
  if (q) { dx = q.x; dy = q.y; }
  wrap.style.left = `${cx - dx}px`;
  wrap.style.top = `${cy - dy}px`;
  wrap._anchor = [ dx, dy ];
}
// Where a lat/lon/altitude lands on screen, via mappo's own projection.
function onGlobe(wrap, lat, lon, radii) {
  const map = globeOf(wrap);
  if (!map) return null;
  const q = map.locate(lat, lon, radii);
  if (!q) return null;
  // Wrapper coordinates, not page coordinates: the overlay is a child of the
  // wrapper and shares its transform, so no offset belongs here.
  const dx = q.x - q.cx, dy = q.y - q.cy, d = Math.hypot(dx, dy) || 1;
  return { x: q.x, y: q.y, front: q.front !== false, up: { x: dx / d, y: dy / d } };
}

// The ground track: a great circle from the pad on a fixed azimuth.
function downrangeTo(lat0, lon0, bearingDeg, km) {
  const R = M.R_EARTH, d = km / R, br = bearingDeg * RAD;
  const p1 = lat0 * RAD, l1 = lon0 * RAD;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(d) + Math.cos(p1) * Math.sin(d) * Math.cos(br));
  const l2 = l1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(p1),
                             Math.cos(d) - Math.sin(p1) * Math.sin(p2));
  return [ p2 / RAD, ((l2 / RAD + 540) % 360) - 180 ];
}

// Draw a mesh centred on a screen point at a chosen pixel height. The vehicle
// is exaggerated on purpose: 121 m against a 6,371 km globe is a hundredth of
// a pixel, and a mission view that renders the rocket at true scale renders
// nothing at all.
function drawVehicle(ctx, side, m, at, px, { pitch = 0, yaw = 0.7, up = null } = {}) {
  if (!at || !at.front) return;
  // A rocket stands along the local vertical, which on a sphere points away
  // from the centre of the disc and is only "up the screen" at one place on it.
  // The mesh projects with +Z up the screen, so the whole drawing is rotated
  // onto the radial instead.
  let rolled = false;
  if (up) {
    const a = Math.atan2(up.x, -up.y);
    if (Math.abs(a) > 1e-3) {
      ctx.save();
      ctx.translate(at.x, at.y); ctx.rotate(a); ctx.translate(-at.x, -at.y);
      rolled = true;
    }
  }
  const zs = m.verts.map((v) => v[2]);
  const height = Math.max(...zs) - Math.min(...zs) || 1;
  const c = S.createCamera();
  c.target = [ 0, 0, height / 2 ]; c.az = yaw; c.el = pitch; c.fov = 30;
  // The distance that puts `height` metres onto exactly `px` pixels.
  c.distance = height * ((side / 2) / Math.tan(15 * RAD)) / px;
  const P = S.projector(c, side, side, at.x, at.y);
  S.drawMesh(ctx, m, P, { light: S.norm([ 0.75, 0.35, 0.55 ]), ambient: 0.52 });
  if (rolled) ctx.restore();
}

// ── NEAR EARTH, in three.js ─────────────────────────────────────────────────
// Built once, lazily, because the WebGL context and the texture are not free
// and the cruise view never needs them.
let N = null, meshesReady = false;
function nearScene() {
  if (!N) {
    N = N3.createNearScene({ canvas: $("near3d"), textureEl: $("earthFlat") });
  }
  if (!meshesReady && BOOSTER_M.verts.length && SHIP_M.verts.length) {
    const mat = () => new THREE.MeshLambertMaterial({ vertexColors: true });
    N.stackObj = new THREE.Mesh(N3.toGeometry(STACK), mat());
    N.shipObj = new THREE.Mesh(N3.toGeometry(SHIP_M), mat());
    N.boostObj = new THREE.Mesh(N3.toGeometry(BOOSTER_M), mat());
    // Scale is solved per frame below; metres to kilometres is folded into it.
    for (const o of [ N.stackObj, N.shipObj, N.boostObj ]) N.vehicles.add(o);
    meshesReady = true;
  }
  // A handle for the console: this is a demo, and being able to poke the
  // scene from devtools is worth one global.
  window.mission = { scene: N, THREE };
  return N;
}
// A 121 m stack on a 6,371 km planet is a tenth of a pixel from any distance
// that also shows a coastline, so it is drawn larger than life. Rather than
// pick one lie and keep it, the exaggeration is solved every frame to hold the
// vehicle at a constant FRACTION of the frame: the camera can then pull from
// five kilometres to two hundred without the ship dwindling to a speck, which
// is the whole reason a mission view exaggerates in the first place.
//
// Said plainly because it is a lie: at true scale the stack is invisible here.
const STACK_M = 0.123;                 // km, actual
const APPARENT = 0.30;                 // of frame height
const FOV_DEG = 38;
const exaggerationFor = (distKm) =>
  (2 * distKm * Math.tan((FOV_DEG / 2) * RAD) * APPARENT) / STACK_M;
const STACK_KM = 1.5;                  // a nominal size, for framing distances

function sceneNearEarth(t, w, h) {
  earthWrap.hidden = true; marsWrap.hidden = true;
  const n = nearScene();
  $("near3d").style.display = "block";
  n.resize(w, h);

  const g = shipGround(t);
  const staged = t >= 153;

  // The sun where the sun actually is, from the same earthAt() the transfer is
  // solved with — so the terminator on the globe and the light on the rocket
  // are the same fact rather than two guesses.
  const sky = earthAt(new Date(LAUNCH_MS + t * 1000));
  n.setSun(N3.latLonToVec(sky.dec, sky.subLon, 1).normalize());

  if (meshesReady) {
    // Solve the scale for the distance the camera is about to be at.
    const distKm = t <= SECO_T ? 430 : STACK_KM * 3.4 + g.alt * 1.6;
    const e = exaggerationFor(distKm) * 0.001;
    for (const o of [ n.stackObj, n.shipObj, n.boostObj ]) o.scale.setScalar(e);
    // Pitch over as the climb proceeds: vertical off the pad, downrange by MECO.
    const lean = Math.min(1, Math.max(0, (t - 18) / 150)) * 1.15;
    n.stackObj.visible = !staged;
    n.shipObj.visible = staged;
    n.boostObj.visible = staged && t <= 430;
    if (!staged) n.stand(n.stackObj, g.lat, g.lon, g.alt, { lean });
    else {
      n.stand(n.shipObj, g.lat, g.lon, g.alt, { lean: 1.35 });
      const [ ba, bd ] = lerpTable(BOOSTER, Math.min(t, 416));
      const [ bla, blo ] = downrangeTo(PAD.lat, PAD.lon, 93, bd);
      n.stand(n.boostObj, bla, blo, ba, { lean: t > 300 ? 0.06 : 2.6 });
    }
  }

  // Trails, in world space — they are 3D curves now, not screen polylines.
  // Lifted a couple of kilometres so the early path is not buried in the
  // surface it starts on — the first hundred seconds are all at altitude zero.
  const LIFT = 2;
  const ship = [], boost = [];
  for (let x = 0; x <= Math.max(1, t); x += Math.max(1.2, t / 260)) {
    const q = shipGround(x);
    ship.push(N3.latLonToVec(q.lat, q.lon, N3.R_EARTH + q.alt + LIFT));
  }
  if (staged) {
    for (let x = 153; x <= Math.min(t, 416); x += 2) {
      const [ ba, bd ] = lerpTable(BOOSTER, x);
      const [ bla, blo ] = downrangeTo(PAD.lat, PAD.lon, 93, bd);
      boost.push(N3.latLonToVec(bla, blo, N3.R_EARTH + ba + LIFT));
    }
  }
  n.setTrail(n.shipTrail, ship);
  n.setTrail(n.boostTrail, boost);

  // The shot: low over the Gulf early, pulling back and up as the climb goes.
  const climb = Math.min(1, Math.max(0, t / 420));
  const watch = t > SECO_T ? g : (staged && t < 430
    ? (() => { const [ ba, bd ] = lerpTable(BOOSTER, Math.min(t, 416));
               const [ la, lo ] = downrangeTo(PAD.lat, PAD.lon, 93, bd);
               return { lat: la, lon: lo, alt: ba }; })()
    : g);
  // Framed off the vehicle's own size, so the shot holds as the exaggeration
  // is tuned: stand back three-and-a-half vehicle lengths, lift by one, and
  // aim at its middle. Then pull out with the climb.
  // Until SECO the camera does not move. Everything worth watching — liftoff,
  // max q, staging, the boostback, the entry burn, the catch — happens within
  // about two hundred kilometres of the pad, so one wide shot from the south
  // holds all of it and the two paths draw themselves across the Gulf instead
  // of being chased. After SECO there is nothing left to hold on to, and the
  // camera follows the ship.
  if (t <= SECO_T) {
    n.lookAtSurface(PAD.lat, PAD.lon, {
      altKm: 165, backKm: 430, targetAltKm: 55,
      bearing: 183                     // due south of the pad, looking north
    });
  } else {
    const dist = STACK_KM * 3.4 + watch.alt * 1.6;
    n.lookAtSurface(watch.lat, watch.lon, {
      altKm: dist * 0.32, backKm: dist,
      targetAltKm: watch.alt + dist * 0.06, heading: 93
    });
  }
  n.render();
  const [ , dr, speed ] = lerpTable(ASCENT, Math.max(0, t));
  return { alt: g.alt, dr, speed };
}

const hideNear = () => { const c = $("near3d"); if (c) c.style.display = "none"; };

// CRUISE — heliocentric, kilometres. Both orbits, the arc, and where everyone
// is on it right now. No globe here: at 156 million km a planet is a dot, and
// a dot is what it should be.
function sceneCruise(t, w, h) {
  earthWrap.hidden = true; marsWrap.hidden = true; hideNear();
  const ms = LAUNCH_MS + t * 1000;
  const dt = Math.max(0, Math.min(TRIP.days * 86400, (ms - TMI_MS) / 1000));
  const ship = M.propagate(TRIP.earth.rKm, TRIP.v1, dt);
  const e = M.stateAt("earth", new Date(ms)), m = M.stateAt("mars", new Date(ms));

  cam.target = [ 0, 0, 0 ];
  cam.distance = 6.2e8 * zoomBias; cam.fov = 38;
  const P = S.projector(cam, w, h, clearX(w));

  S.drawPath(ctx, P, EARTH_ORBIT, { color: "rgba(79,143,216,.34)", width: 1 });
  S.drawPath(ctx, P, MARS_ORBIT, { color: "rgba(193,97,58,.34)", width: 1 });
  const cut = Math.round((dt / (TRIP.days * 86400)) * (ARC.length - 1));
  S.drawPath(ctx, P, ARC, { color: "rgba(255,212,121,.24)", width: 1, dash: [ 3, 5 ] });
  S.drawPath(ctx, P, ARC.slice(0, cut + 1), { color: "#ffd479", width: 1.8 });

  const sun = P([ 0, 0, 0 ]);
  if (sun) {
    const g = ctx.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, 26);
    g.addColorStop(0, "#fff6dd"); g.addColorStop(.35, "rgba(255,196,92,.55)");
    g.addColorStop(1, "rgba(255,160,60,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sun.x, sun.y, 26, 0, 7); ctx.fill();
  }
  dotAt(P, e.rKm, "#4f8fd8", 4.5, "Earth");
  dotAt(P, m.rKm, "#c1613a", 4, "Mars");
  dotAt(P, ship.r, "#ffd479", 3.4, "Starship");
  return { alt: 0, dr: 0, speed: Math.hypot(...ship.v), shipR: ship.r, marsR: m.rKm };
}

// MARS — the arrival, over a mappo Mars. Same component, same locate(), a
// different body pack behind it: the whole point of the packs is that the
// approach to Arcadia Planitia is drawn by the code that drew Starbase.
function sceneMars(t, w, h) {
  earthWrap.hidden = true; marsWrap.hidden = false; hideNear();
  const ms = LAUNCH_MS + t * 1000;
  const left = Math.max(0, (ARRIVE_MS - ms) / 1000);
  // Closing from an approach view to the landing site over the last hours.
  const k = Math.min(1, Math.max(0, 1 - left / (2 * 86400)));
  const px = (h * 0.78 + h * 2.0 * k) * zoomBias;
  sizeGlobe(marsWrap, px, clearX(w), h / 2, [ SITE.lat, SITE.lon ]);
  const ctx = ocContext(marsWrap, px);

  // Altitude on the way in: sphere of influence down to the surface, eased so
  // the last minutes are legible rather than instantaneous.
  const altKm = Math.max(0, 12000 * Math.pow(Math.min(1, left / (2 * 86400)), 0.6));
  const bear = 300;
  const [ lat, lon ] = downrangeTo(SITE.lat, SITE.lon, bear, altKm > 0 ? Math.min(2600, altKm * 0.55) : 0);

  const trail = [];
  for (let f = 0; f <= 1; f += 1 / 80) {
    const l2 = left + (1 - f) * 0;
    const a2 = 12000 * Math.pow(Math.min(1, (left + (1 - f) * (2 * 86400 - left)) / (2 * 86400)), 0.6);
    const [ la, lo ] = downrangeTo(SITE.lat, SITE.lon, bear, Math.min(2600, a2 * 0.55));
    const q = onGlobe(marsWrap, la, lo, 1 + a2 / M.R_MARS);
    trail.push(q && q.front ? q : null);
  }
  ctx.strokeStyle = "rgba(255,212,121,.8)"; ctx.lineWidth = 1.5; ctx.beginPath();
  let pen = false;
  for (const q of trail) { if (!q) { pen = false; continue; }
    if (pen) ctx.lineTo(q.x, q.y); else { ctx.moveTo(q.x, q.y); pen = true; } }
  ctx.stroke();

  const site = onGlobe(marsWrap, SITE.lat, SITE.lon, 1);
  if (site && site.front) {
    ctx.strokeStyle = "#ffd479"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(site.x, site.y, 7, 0, 7); ctx.stroke();
    ctx.fillStyle = "rgba(255,229,180,.8)"; ctx.font = "10px ui-monospace,Menlo,monospace";
    ctx.fillText(SITE.name, site.x + 11, site.y + 3.5);
  }
  const mAt = onGlobe(marsWrap, lat, lon, 1 + altKm / M.R_MARS);
  drawVehicle(ctx, px, SHIP_M, mAt, 36 + 110 * k, { pitch: 0.05, yaw: 1.5, up: mAt?.up });

  const dt = Math.max(0, Math.min(TRIP.days * 86400, (ms - TMI_MS) / 1000));
  const ship = M.propagate(TRIP.earth.rKm, TRIP.v1, dt);
  const mm = M.stateAt("mars", new Date(ms));
  return { alt: altKm, dr: 0, speed: Math.hypot(...S.sub(ship.v, mm.v)), left };
}

function dotAt(P, p, color, r, label) {
  const q = P(p);
  if (!q) return;
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(q.x, q.y, r, 0, 7); ctx.fill();
  if (label) {
    ctx.fillStyle = "rgba(219,230,245,.72)";
    ctx.font = "10px ui-monospace,Menlo,monospace";
    ctx.fillText(label, q.x + r + 5, q.y + 3.5);
  }
}

// ── readouts ────────────────────────────────────────────────────────────────
const fmtMET = (s) => {
  const sign = s < 0 ? "−" : "+";
  const a = Math.abs(s);
  if (a < 86400) {
    const hh = Math.floor(a / 3600), mm = Math.floor(a / 60) % 60, ss = Math.floor(a % 60);
    return `${sign}${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}:${String(ss).padStart(2, "0")}`;
  }
  return `${sign}${Math.floor(a / 86400)} d ${String(Math.floor((a % 86400) / 3600)).padStart(2, "0")} h`;
};
const km = (v) => v >= 1e6 ? `${(v / 1e6).toFixed(2)} M km` : v >= 1000 ? `${Math.round(v).toLocaleString()} km` : `${v.toFixed(1)} km`;
const rows = (el, pairs) => {
  el.innerHTML = pairs.map(([ k, v ]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
};

// ── the porkchop, drawn ─────────────────────────────────────────────────────
(function drawPork() {
  const c = $("pork"), g = c.getContext("2d");
  const cols = pork.grid.length, rowsN = pork.grid[0].column.length;
  const vals = pork.grid.flatMap((x) => x.column).filter(Number.isFinite);
  const lo = Math.min(...vals), hi = Math.min(Math.max(...vals), lo + 4);
  const img = g.createImageData(cols, rowsN);
  for (let x = 0; x < cols; x++) for (let y = 0; y < rowsN; y++) {
    const v = pork.grid[x].column[y];
    const k = Number.isFinite(v) ? Math.max(0, Math.min(1, (v - lo) / (hi - lo))) : 1;
    const i = (y * cols + x) * 4;
    img.data[i] = 20 + 235 * (1 - k) + 60 * k;
    img.data[i + 1] = 30 + 180 * (1 - k);
    img.data[i + 2] = 50 + 60 * (1 - k) + 90 * k;
    img.data[i + 3] = Number.isFinite(v) ? 255 : 40;
  }
  const off = document.createElement("canvas");
  off.width = cols; off.height = rowsN;
  off.getContext("2d").putImageData(img, 0, 0);
  g.imageSmoothingEnabled = false;
  g.drawImage(off, 0, 0, c.width, c.height);
  // Where the mission actually goes.
  const bx = ((TRIP.departure - SCAN.from) / 86400000 / SCAN.stepDays) / cols * c.width;
  const by = ((TRIP.days - SCAN.tofMin) / SCAN.tofStep) / rowsN * c.height;
  g.strokeStyle = "#ffd479"; g.lineWidth = 1.5;
  g.beginPath(); g.arc(bx, by, 5, 0, 7); g.stroke();
  g.beginPath(); g.moveTo(bx - 9, by); g.lineTo(bx - 6, by); g.moveTo(bx + 6, by); g.lineTo(bx + 9, by); g.stroke();
  const d = (x) => x.toISOString().slice(0, 10);
  $("porkA").textContent = d(SCAN.from);
  $("porkB").textContent = d(new Date(SCAN.from.getTime() + SCAN.toDays * 86400000));
})();

rows($("winkv"), [
  [ "Departure", `<b>${TRIP.departure.toISOString().slice(0, 10)}</b>` ],
  [ "Arrival", TRIP.arrival.toISOString().slice(0, 10) ],
  [ "Flight time", `${TRIP.days} days` ],
  [ "C3", `${TRIP.c3.toFixed(2)} km²/s²` ],
  [ "Δv from LEO", `${TRIP.dvDepart.toFixed(2)} km/s` ],
  [ "Phase angle", `${TRIP.phaseAngle.toFixed(1)}°` ],
  [ "Next window", `+${Math.round(M.SYNODIC_DAYS)} d` ]
]);

// ── phase strip ─────────────────────────────────────────────────────────────
const strip = $("phases");
for (const p of PHASES) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = p.name; b.dataset.id = p.id;
  b.addEventListener("click", () => {
    clock.setTime(LAUNCH_MS + p.t * 1000);
    // A phase measured in seconds wants a clock measured in seconds.
    paint();
  });
  strip.appendChild(b);
}

// ── where every number came from ────────────────────────────────────────────
// Written out rather than summarised: a page that computes a launch date owes
// the reader the ability to check it.
const SOURCES = [
  [ "Landing site",
    "Candidate landing sites for Starship, imaged by HiRISE at SpaceX's request — southern Arcadia Planitia, over shallow ground ice. The marker is one of those frames, 39.09°N 189.79°E.",
    "https://www.uahirise.org/ESP_061194_2190" ],
  [ "Site selection",
    "Golombek et al., “SpaceX Starship landing sites on Mars”, LPSC 2021 abstract 2420 — why Arcadia: ice within a few metres, low elevation for entry, low enough latitude for power.",
    "https://www.hou.usra.edu/meetings/lpsc2021/pdf/2420.pdf" ],
  [ "Launch window",
    "The 2026 window opens in November and does not come back until 2029 — the independent check on the porkchop below, which picks 2026-10-31 on its own.",
    "https://www.19fortyfive.com/2026/08/the-mars-launch-window-opens-in-november-2026-and-closes-about-a-month-later-the-next-one-is-in-2029/" ],
  [ "Ascent timeline",
    "Flight 5, the first booster catch: MECO T+02:33, landing burn and catch T+06:56. The event times on the phase strip are these; the profile between them is interpolated.",
    "https://www.nasaspaceflight.com/2024/10/starship-flight-5-catch/" ],
  [ "Vehicle",
    "Starship and Super Heavy specifications — 121 m stacked, 71 m booster, 9 m diameter, 33 Raptor 2 and 3 + 3 on the ship.",
    "https://orbitalradar.com/launch-vehicles/starship" ],
  [ "Pad",
    "Starbase, Texas. The launch site sits on the coast at 25.9972°N 97.1560°W; Wikipedia's facility coordinate, 25.9875°N 97.1864°W, is the production site inland of it.",
    "https://en.wikipedia.org/wiki/SpaceX_Starbase" ],
  [ "3D models",
    "“Space X Starship and Super Heavy crew cargo” by gallus-gallus, BlendSwap, CC0. Decimated to 19k and 9.6k triangles with Blender headless; they measure 72.1 m and 52.8 m against a published 71 and 50.",
    "https://blendswap.com/blend/27853" ],
  [ "Planet positions",
    "JPL's Keplerian elements and rates for Earth and Mars, valid 1800–2050, in demo/mission.js. Mars' 1.85° inclination is why the transfer is not a flat problem.",
    "https://ssd.jpl.nasa.gov/planets/approx_pos.html" ],
  [ "Trajectory",
    "Lambert's problem in universal variables across 1,189 departure/flight-time pairs — the porkchop — then propagated with the same formulation, which agrees with the solved arc to one part in 1e13.",
    "https://en.wikipedia.org/wiki/Lambert%27s_problem" ],
  [ "Coastlines",
    "Natural Earth, public domain, via mappo's own Earth pack — the same data the globes are drawn from, pinned by checksum.",
    "https://www.naturalearthdata.com" ]
];
$("srcbody").innerHTML = "<dl>" + SOURCES.map(([ k, why, url ]) =>
  `<dt>${k}</dt><dd>${why} <a href="${url}" target="_blank" rel="noopener">↗</a></dd>`).join("") + "</dl>";

$("note").innerHTML =
  `Everything from trans-Mars injection onward is solved: Lambert's problem across ` +
  `1,189 departure/flight-time pairs, propagated with universal variables. ` +
  `Ascent event times are Flight 5's — MECO T+02:33, catch T+06:56 — with a plausible ` +
  `profile interpolated between them, which is the one part of this that is drawn ` +
  `rather than computed. Drag to orbit, scroll to zoom. <a href="./">More demos</a>.`;

// ── frame ───────────────────────────────────────────────────────────────────
function paint() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = view.clientWidth, h = view.clientHeight;
  if (view.width !== w * dpr) { view.width = w * dpr; view.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (starCv._w !== w || starCv._h !== h) { drawStars(w, h); starCv._w = w; starCv._h = h; }

  const ms = now();
  const t = T(ms);
  const p = phaseAt(t);

  // Three views, chosen by where the mission is: mappo Earth for everything
  // inside Earth's neighbourhood, a heliocentric scene for the eight months in
  // between, mappo Mars for the arrival.
  let info;
  if (ms < TMI_MS) info = sceneNearEarth(t, w, h);
  else if (ARRIVE_MS - ms > 2 * 86400000) info = sceneCruise(t, w, h);
  else info = sceneMars(t, w, h);

  $("phase").textContent = p.name;
  $("met").innerHTML = `<span>T</span> ${fmtMET(t)} <span>· ${p.blurb}</span>`;
  for (const b of strip.children) b.setAttribute("aria-current", String(b.dataset.id === p.id));

  const toGo = (ARRIVE_MS - ms) / 86400000;
  const sep = info.marsR ? S.len(S.sub(info.marsR, info.shipR)) : null;
  rows($("telekv"), [
    [ "UTC", new Date(ms).toISOString().slice(0, 16).replace("T", " ") ],
    [ "Speed", `${info.speed.toFixed(2)} km/s` ],
    [ "Altitude", t < 600 ? km(info.alt) : info.alt > 0 ? km(info.alt) : "—" ],
    [ "Downrange", t < 600 ? km(info.dr) : "—" ],
    [ "To Mars", sep ? km(sep) : "—" ],
    [ "Days to arrival", toGo > 0 ? toGo.toFixed(1) : "arrived" ],
    [ "Entry speed", `${TRIP.vEntry.toFixed(2)} km/s` ]
  ]);
}

function frame() {
  requestAnimationFrame(frame);      // first, so a throw costs one frame, not the page
  clock.step(); clock.render(); paint();
}
addEventListener("resize", paint);
frame();
</script>
