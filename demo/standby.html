<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Standby · Mappo.js</title>
<link rel="icon" href="../favicon/favicon-32x32.png">
<style>
  /* Apple's landscape standby clock, rebuilt on mappo. Measured from a
     screenshot rather than eyeballed: the dot grid is an 18 px square pitch
     with dots at 0.53 of a cell, and the palette below is sampled from the
     original — the clock is pure red, the daylit dots sit well under it, and
     night is the same hue at about a fifth of the brightness. */
  :root{
    --red:#ff0000;          /* the clock, and only the clock, is full red */
    --day:#d40000;          /* sampled: lit dots never reach the clock's red */
    --night:#260000;        /* and night is that hue at ~13% */
    /* The terminator fades as it falls, and not linearly — sampled down the
       original it reads 160 at the arc, 90 by mid-frame, 25 by three quarters
       down and 20 under the map, so the ramp is steepest in its last third. */
    --line-0:#c00000; --line-16:#a00000; --line-50:#5a0000;
    --line-72:#1a0000; --line-100:#140000;
    --pitch:18.5;           /* px between dot centres at the reference size */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:#000;overflow:hidden;
    font-family:-apple-system,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden}

  /* Both dot layers share one box so they register cell for cell. */
  /* Two constraints, and in the original they land on the same number: the map
     is 95% of the frame wide AND 82% of it tall. 360 degrees over the 142 the
     latitude band spans makes the box 2.535 wide for 1 tall, so 82% of height
     is 2.32 x the height in width — take whichever runs out first and the
     proportions survive any aspect the frame happens to be. */
  .maps{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(95vw, 232vh)}
  .maps mappo-world{display:block;width:100%}
  /* The night map is the SAME map in the night palette, revealed through the
     terminator — not a grey film over one map, which would dim the geography
     as well as the light. */
  .night{position:absolute;inset:0;clip-path:url(#nightclip)}
  .defs{position:absolute;width:0;height:0}

  /* City dots ride the map as overlay children: mappo puts them on their
     coordinates, so they cannot drift from the grid under them. */
  /* A marker has to read as floating ABOVE the dot field, and on a black ground
     that is harder than it sounds: a black shadow is invisible against black,
     so the only surface it can fall on is the field itself. Which is exactly
     right — the shadow darkens the dots it lands across, and those dimmed dots
     ARE the depth cue. No ring: a hard edge of background colour reads as an
     outline drawn around the marker, not as a gap under it.
     Two layers — a tight, hard one hugging the marker and a second reaching a
     good two cells past it — both fully opaque and deliberately under-blurred,
     because a hard edge reads as a nearer light and that is what sells the
     height. Both are CENTRED, with no offset: nothing else on this page casts
     a shadow, so angling these would invent a light source the rest of the map
     does not share, and a marker is a pinpoint on a chart rather than an object
     sitting on a table. A uniform aura reads as depth without claiming a sun.
     Everything scales off the grid pitch. */
  .city-dot{position:absolute;border-radius:50%;background:var(--day);
    transform:translate(-50%,-50%);border:0;padding:0;appearance:none;
    cursor:pointer;transition:background .18s ease,transform .18s ease;
    box-shadow:0 0 var(--near-b,5px) var(--near-s,2px) rgba(0,0,0,1),
               0 0 var(--far-b,17px) var(--far-s,3px) rgba(0,0,0,1)}
  /* The city the face is reading grows and goes full red; hovering shows the
     same thing, because hover IS a preview of the selection. Red alone was too
     quiet a cue at this size — #ff against #d4 is nothing across nine pixels —
     so size carries it. Home is told apart by its own larger radius, set in
     JS, which is a separate axis and so never collides with this one. */
  .city-dot.on,.city-dot:hover{background:var(--red);
    transform:translate(-50%,-50%) scale(1.15)}
  .city-dot:focus-visible{outline:2px solid var(--red);outline-offset:4px}

  /* The terminator covers the whole stage, not the map box: the curve runs off
     the bottom of the frame and that overshoot is part of the picture. */
  .term{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .place{position:absolute;left:5.9%;bottom:10.5%;color:var(--red);line-height:1;
    display:block;text-align:left;font:inherit;background:none;border:0;padding:0;
    appearance:none;
    /* Inert until there is somewhere to come back FROM: a control that does
       nothing should not offer a cursor, a focus stop, or a hit area. */
    cursor:default;pointer-events:none}
  .place.away{cursor:pointer;pointer-events:auto;transition:opacity .18s ease}
  .place.away:hover,.place.away:focus-visible{opacity:.7}
  .place .city{display:block;font-size:5.8vh;font-weight:590;
    letter-spacing:-.015em;margin-bottom:.34em}
  .place .clock{display:block;font-size:20.5vh;font-weight:700;
    letter-spacing:-.045em;font-variant-numeric:tabular-nums}
  .place:focus-visible{outline:2px solid var(--red);outline-offset:8px;border-radius:4px}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="stage" role="img" aria-label="A dotted world map in red, with the daylight boundary drawn across it and the local time.">
  <div class="maps" id="maps">
    <mappo-world id="daymap"
      cols="66" lat-min="-58" lat-max="84"
      figure="dots" dot-shape="circle" dot-size="0.53"
      figure-color="var(--day)" ground-color="none" background="none"
      graticule="false" interactive="false"></mappo-world>

    <div class="night" aria-hidden="true">
      <mappo-world id="nightmap"
        cols="66" lat-min="-58" lat-max="84"
        figure="dots" dot-shape="circle" dot-size="0.53"
        figure-color="var(--night)" ground-color="none" background="none"
        graticule="false" interactive="false" overlays="false"></mappo-world>
    </div>
  </div>

  <svg class="defs" aria-hidden="true">
    <defs><clipPath id="nightclip" clipPathUnits="objectBoundingBox">
      <path id="nightpath" d="M0 0"/>
    </clipPath></defs>
  </svg>

  <svg class="term" id="term" aria-hidden="true" preserveAspectRatio="none">
    <defs>
      <linearGradient id="linefade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0"   stop-color="var(--line-0)"/>
        <stop offset=".16" stop-color="var(--line-16)"/>
        <stop offset=".50" stop-color="var(--line-50)"/>
        <stop offset=".72" stop-color="var(--line-72)"/>
        <stop offset="1"   stop-color="var(--line-100)"/>
      </linearGradient>
    </defs>
    <g id="termglow" fill="none" stroke="url(#linefade)" opacity=".22"></g>
    <g id="termline" fill="none" stroke="url(#linefade)" stroke-linecap="round"></g>
  </svg>

  <button type="button" class="place" id="place">
    <span class="city" id="cityname">&nbsp;</span>
    <span class="clock" id="bigclock">--:--</span>
  </button>
</div>

<script type="module">
import "../dist/all.js";
import { earthAt } from "./astro.js";
import { FACE, fx, fy, nightRings, terminatorCurves } from "./standby-face.js";
import { CLOCK_CITIES } from "./clocks.js";

// One definition, shared with every other page that draws this face.
const LAT_RANGE = FACE.latRange;

// ?at=2026-09-02T00:24Z freezes the clock. The terminator is the one thing on
// this page that cannot be checked by looking — it has to be checked against a
// known moment — so pinning one is worth an attribute.
const pinned = new URLSearchParams(location.search).get("at");
const AT = pinned ? new Date(pinned) : null;
const nowish = () => AT ?? new Date();
const maps   = document.getElementById("maps");

// ── where are we ────────────────────────────────────────────────────────────
// The time zone, not geolocation: it needs no permission prompt, it is right
// the moment the page paints, and it is what Apple is showing anyway — the
// city you set, not a GPS fix. Geolocation would buy a few hundred metres of
// precision on a dot that is nine pixels wide.
const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
const known = CLOCK_CITIES.find((c) => c.tz === tz);
const here = known ?? {
  name: (tz.split("/").pop() || "Here").replace(/_/g, " "),
  // No gazetteer hit: put the dot on the zone's own meridian, at a latitude
  // that at least lands on the right side of the equator.
  lon: -(new Date().getTimezoneOffset() / 4),
  lat: 25, tz
};

// "1:24", not "1:24 AM": the face shows the period nowhere, so the parts get
// assembled by hand rather than trusting a locale to leave it out. One
// formatter per zone, built on demand and then kept — they are expensive to
// construct and free to reuse, and the face can now be asked for any of a
// dozen zones.
const clockFor = (() => {
  const cache = new Map();
  return (zone) => {
    let fmt = cache.get(zone);
    if (!fmt) {
      const p = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", timeZone: zone });
      fmt = (d) => p.formatToParts(d)
        .filter((x) => x.type === "hour" || x.type === "literal" || x.type === "minute")
        .map((x) => (x.type === "literal" ? ":" : x.value)).join("").replace(/:+$/, "");
      cache.set(zone, fmt);
    }
    return fmt;
  };
})();
const bigclock = document.getElementById("bigclock");
const cityname = document.getElementById("cityname");
const placeBtn = document.getElementById("place");

// ── city dots ───────────────────────────────────────────────────────────────
// These are not mappo overlay children: those are harvested once at upgrade,
// and these are born afterward. They ride the same stage projection the
// terminator uses, so one function places every mark.
const stage = document.querySelector(".stage");
const dots = [ ...CLOCK_CITIES.filter((c) => c.tz !== here.tz), here ].map((c) => {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "city-dot" + (c === here ? " here" : "");
  el.setAttribute("aria-label", `Show the time in ${c.name}`);
  el.addEventListener("click", () => select(c));
  stage.appendChild(el);
  return { el, c };
});

// Which city the face is reading. The MAP does not follow it: the terminator
// is the real sky at this instant and does not care who is looking at it, so
// picking a city changes two lines of text and nothing else. That is also why
// the answer is honest — read Tokyo from Lisbon and the dot you tapped really
// is in daylight or really is not.
let selected = here;
const showClock = () => { bigclock.textContent = clockFor(selected.tz)(nowish()); };

function select(city) {
  selected = city;
  cityname.textContent = city.name;
  const away = city !== here;
  placeBtn.classList.toggle("away", away);
  placeBtn.setAttribute("aria-label",
    away ? `Showing ${city.name}. Back to ${here.name}.` : here.name);
  for (const d of dots) d.el.classList.toggle("on", d.c === city);
  showClock();
}
placeBtn.addEventListener("click", () => select(here));

// ── projection ──────────────────────────────────────────────────────────────
// One source of truth: the map's own box. Latitudes outside latRange
// extrapolate, which is what lets the curve run off the bottom of the frame.
const box = () => {
  const w = maps.clientWidth, h = maps.clientHeight;
  const r = maps.getBoundingClientRect(), s = document.querySelector(".stage").getBoundingClientRect();
  return { w, h, ox: r.left - s.left, oy: r.top - s.top };
};
const sx = (lon, b) => b.ox + ((lon + 180) / 360) * b.w;
const sy = (lat, b) => b.oy + ((LAT_RANGE[1] - lat) / (LAT_RANGE[1] - LAT_RANGE[0])) * b.h;
// fx and fy come from standby-face.js, computed over the same band.

const term = document.getElementById("term");
const line = document.getElementById("termline");
const glow = document.getElementById("termglow");
const nightpath = document.getElementById("nightpath");

function placeDots(b) {
  const pitch = maps.clientWidth / 66;
  stage.style.setProperty("--near-b", `${(pitch * 0.30).toFixed(2)}px`);
  stage.style.setProperty("--near-s", `${(pitch * 0.12).toFixed(2)}px`);
  stage.style.setProperty("--far-b",  `${(pitch * 1.60).toFixed(2)}px`);
  stage.style.setProperty("--far-s",  `${(pitch * 0.34).toFixed(2)}px`);
  for (const { el, c } of dots) {
    // Measured off the original: a city mark is about twice a grid dot, which
    // at a 0.53 fill means a shade over one whole cell.
    const d = pitch * (c.tz === here.tz ? 1.24 : 1.06);
    el.style.width = el.style.height = `${d}px`;
    el.style.left = `${sx(c.lon, b).toFixed(1)}px`;
    el.style.top  = `${sy(c.lat, b).toFixed(1)}px`;
  }
}

function paint(now = nowish()) {
  const { dec, subLon } = earthAt(now);
  const b = box();
  term.setAttribute("viewBox", `0 0 ${term.clientWidth} ${term.clientHeight}`);

  // Night, in the map's own units, for the clip.
  nightpath.setAttribute("d", nightRings(dec, subLon, 0, LAT_RANGE)
    .map((r) => "M" + r.map(([ lon, lat ]) =>
      `${fx(lon).toFixed(5)} ${fy(lat).toFixed(5)}`).join("L") + "Z").join(""));

  // The lit edge, in stage pixels, free to leave the map box.
  const d = terminatorCurves(dec, subLon, 0, LAT_RANGE)
    .map((c) => "M" + c.map(([ lon, lat ]) =>
      `${sx(lon, b).toFixed(1)} ${sy(lat, b).toFixed(1)}`).join("L")).join("");
  // 6 px of the reference frame 1280 wide, and the glow a little over twice it.
  const sw = term.clientWidth * 0.0047;
  line.setAttribute("stroke-width", sw.toFixed(2));
  // The arc measures 13 px across where its core is 6, so the halo is narrow
  // and faint — the line has to stay DIMMER than the daylit dots, which is the
  // relationship that reads as "a line drawn on the map" rather than a light.
  glow.setAttribute("stroke-width", (sw * 2.2).toFixed(2));
  glow.style.filter = `blur(${(sw * 0.5).toFixed(1)}px)`;
  line.innerHTML = glow.innerHTML = `<path d="${d}"/>`;

  placeDots(b);
  showClock();
}

// The clock changes every second and costs almost nothing; the terminator costs a
// few hundred points of trigonometry and moves a quarter of a degree a minute.
// So they tick apart: the digits every second, the sky every half minute.
addEventListener("resize", () => paint());
customElements.whenDefined("mappo-world").then(() => requestAnimationFrame(() => paint()));
select(here);
paint();
if (!AT) { setInterval(showClock, 1000); setInterval(paint, 30000); }
</script>
