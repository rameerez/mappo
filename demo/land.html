<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mappo — land styles</title>
<link rel="shortcut icon" href="../favicon/favicon.ico" type="image/x-icon">
<style>
 :root{--page:#fffbf5;--land:#c9d3bd;--coast:#5f7a4a;--ink:#1b1a19;--grid:#ddd8cd}
 html[data-theme="dark"]{--page:#14161a;--land:#2a3340;--coast:#7aa2f7;--ink:#e7ecf3;--grid:#2a3038}
 body{margin:0;padding:24px;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
 h2{font-size:11px;text-transform:uppercase;letter-spacing:.12em;opacity:.6;margin:22px 0 6px}
 code{background:rgb(0 0 0/.06);padding:1px 5px;border-radius:4px;font-size:12px}
 .row{display:grid;grid-template-columns:repeat(2,1fr);gap:26px}
 .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
 button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--grid);background:#fff0;color:var(--ink);cursor:pointer}
</style></head><body>
<button id="t">Toggle dark</button>

<h2>FLAT — <code>figure="dots"</code> · <code>"solid"</code> · <code>"outline"</code> · <code>"solid outline"</code></h2>
<div class="row">
  <mappo-world cols="120" figure-color="var(--land)"></mappo-world>
  <mappo-world cols="120" figure="solid"  figure-color="var(--land)"></mappo-world>
  <mappo-world cols="120" figure="outline" figure-stroke="var(--coast)"></mappo-world>
  <mappo-world cols="120" figure="solid outline" figure-color="var(--land)" figure-stroke="var(--coast)" figure-stroke-width="1.5"></mappo-world>
</div>

<h2>GLOBE — the same four values, identical option names</h2>
<div class="row3">
  <mappo-world mode="globe" cols="150" rotate-speed="0" roll="-14.3" figure-color="var(--land)"></mappo-world>
  <mappo-world mode="globe" cols="150" rotate-speed="0" roll="-14.3" figure="solid" figure-color="var(--land)"></mappo-world>
  <mappo-world mode="globe" cols="150" rotate-speed="0" roll="-14.3" figure="outline" figure-stroke="var(--coast)"></mappo-world>
</div>
<div class="row3" style="margin-top:20px">
  <mappo-world mode="globe" cols="150" rotate-speed="0" roll="-14.3" figure="solid outline"
    figure-color="var(--land)" figure-stroke="var(--coast)" figure-stroke-width="1.2"></mappo-world>
  <mappo-world mode="globe" cols="150" rotate-speed="0" roll="-14.3" figure="solid outline" graticule
    meridians="24" parallels="23" figure-color="var(--land)" figure-stroke="var(--coast)"
    graticule-color="var(--grid)" equator-color="var(--coast)" equator-opacity="0.8"></mappo-world>
  <mappo-world mode="globe" cols="150" rotate-speed="7" roll="-14.3" tilt="10" figure="solid outline"
    figure-color="var(--land)" figure-stroke="var(--coast)"></mappo-world>
</div>

<script type="module" src="../dist/mappo.js"></script>
<script>t.onclick=()=>{const e=document.documentElement;e.dataset.theme=e.dataset.theme==="dark"?"light":"dark"}</script>
</body></html>
